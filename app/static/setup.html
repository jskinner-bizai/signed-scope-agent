<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Setup</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px}
input{width:100%;box-sizing:border-box;background:#1c2330;color:#e6edf3;border:1px solid #2a3340;border-radius:6px;padding:10px;font:inherit}
button{margin-top:12px;background:#4ea1ff;color:#05111f;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.ok{color:#3fb950}.bad{color:#ff6b6b}.muted{color:#8b98a8;font-size:13px}
</style></head><body><div class="wrap">
<h1>Connect Vultr Serverless Inference</h1>
<p>Paste the API key from your Vultr Serverless Inference subscription. It is saved on this server only
(file mode 600) and is never sent back by any page or API.</p>
<input id="key" type="password" autocomplete="off" placeholder="Inference API key">
<button id="save">Save and test</button>
<p id="out"></p>
<p class="muted">After it says connected, open the <a href="/" style="color:#4ea1ff">agent</a>. The model badge in the top right should name the Vultr model.</p>
</div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
document.getElementById('save').onclick=async()=>{
  const out=document.getElementById('out'); out.textContent='Testing...';
  const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token,key:document.getElementById('key').value})});
  const j=await r.json(); document.getElementById('key').value='';
  if(!r.ok){out.innerHTML='<span class="bad">'+(j.detail||'Failed')+'</span>';return}
  out.innerHTML = j.test_error ? '<span class="bad">Saved, but the test call failed: '+j.test_error+'</span>'
    : '<span class="ok">Connected. Model: '+j.model+'</span>';
};
</script></body></html>
